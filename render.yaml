# No database is provisioned here. Set DATABASE_URL to an existing PostgreSQL.
# Deployment is NOT performed by committing this file.
services:
  - type: web
    name: scrap-to-orbit
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health/ready
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_ACTIVE_ROOMS
        value: "3"
