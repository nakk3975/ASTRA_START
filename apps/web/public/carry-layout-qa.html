<!doctype html><html lang="ko"><meta charset="utf-8"><title>Carry 실제 화면 크기 검수</title><style>body{margin:0;background:#10151b;color:#eee;font:14px system-ui}header{height:70px;display:flex;align-items:center;gap:12px;padding:0 20px}button,select{font:inherit;padding:12px}#area{position:relative;overflow:hidden;width:100vw;height:calc(100vh - 70px)}iframe{border:0;transform-origin:top left;position:absolute;top:0;left:0}</style><header><strong>실제 게임 프레임 · CSS 화면 크기 검수</strong><select aria-label="검수 해상도"><option>1920×1080</option><option>2560×1440</option><option>3840×2160</option><option>3440×1440</option><option>5120×1440</option><option>1366×768</option></select><span id="info"></span></header><div id="area"><iframe title="실제 게임" src="/"></iframe></div><script>const frame=document.querySelector('iframe'),select=document.querySelector('select');function resize(){const [w,h]=select.value.split('×').map(Number),s=Math.min(innerWidth/w,(innerHeight-70)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${s})`;document.getElementById('info').textContent=`${w} × ${h} CSS px / 보기 ${Math.round(s*100)}%`;};select.onchange=resize;onresize=resize;resize();</script></html>
