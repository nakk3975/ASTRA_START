services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: local-orbit-only
      POSTGRES_DB: orbit
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - orbit-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  orbit-postgres:
